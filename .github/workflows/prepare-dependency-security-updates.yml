name: Prepare tested dependency security updates

on:
  pull_request:
    types: [synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/restrict-public-db-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/restrict-public-db-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Safely update backend dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit fix || true
          npm install --save-exact node-cron@4.6.0 nodemailer@10.4.0 uuid@11.1.1
          npm audit fix || true
          npm ls axios body-parser brace-expansion follow-redirects minimatch node-cron nodemailer proxy-addr qs undici uuid || true
          npm test
          npm audit --json > ../backend-audit-final.json || true
          node -e "const r=require('../backend-audit-final.json'); const v=r.metadata?.vulnerabilities||{}; console.log('Backend audit:',v); if ((v.high||0)+(v.critical||0)>0) process.exit(1)"
      - name: Safely update frontend dependencies
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://rankpilot-ixnc.onrender.com/api
        run: |
          npm ci
          npm audit fix || true
          npm install --save-exact next@14.2.35
          npm audit fix || true
          npm ls next axios postcss || true
          npm run build
          npm audit --json > ../frontend-audit-final.json || true
          node -e "const r=require('../frontend-audit-final.json'); const v=r.metadata?.vulnerabilities||{}; console.log('Frontend audit:',v); if ((v.high||0)+(v.critical||0)>0) process.exit(1)"
      - name: Commit tested package and lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Apply tested dependency security updates"
          git push origin HEAD:security/restrict-public-db-access
